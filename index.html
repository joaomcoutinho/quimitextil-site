    <!--
      Contraparte do public/404.html: quando o GitHub Pages devolve um caminho
      convertido em query string (/?/esg), este script restaura o endereco
      original antes do React Router iniciar. Precisa vir antes do modulo do app.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var caminho = l.search.slice(1).split('&').map(function (parte) {
            return parte.replace(/~e~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + caminho + l.hash)
        }
      })(window.location)
    </script>

    <script type="module" src="/src/main.tsx"></script>
