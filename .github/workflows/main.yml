name: Redirecionar a cópia do GitHub Pages para quimitextil.com.br

on:
  push:
    branches: ["main"]
  # Permite disparar o deploy pela aba Actions, sem precisar de um commit novo.
  # Util quando o Pages e reativado e a ultima execucao ficou para tras.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Desde 26/11/2026 esta cópia só redireciona para https://quimitextil.com.br
          # (o site no ar fica na Hostinger). Nada do site é publicado aqui.
          path: './redirect-pages'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
